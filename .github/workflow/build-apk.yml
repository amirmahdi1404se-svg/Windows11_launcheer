name: Build Standalone Win11 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Box64 & Wine Engine
        run: |
          mkdir -p app/src/main/assets/engine
          curl -L -s -o app/src/main/assets/engine/box64 https://github.com/ptitSeb/box64/releases/latest/download/box64-android-arm64 || touch app/src/main/assets/engine/box64
          curl -L -s -o app/src/main/assets/engine/wine.tar.xz https://github.com/Kron4ek/Wine-Builds/releases/download/9.0/wine-9.0-amd64-wow64.tar.xz || touch app/src/main/assets/engine/wine.tar.xz

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Win11-Standalone-APK
          path: app/build/outputs/apk/debug/app-debug.apk

